name: Test and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=2 --test-reporter=spec test/*.test.js 2>&1 | tee test-output.log
      # On failure, publish the failing tests and their errors as one annotation (readable on the
      # run page and through the API) instead of only "exit code 1".
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          summary=$(sed -n '/failing tests:/,$p' test-output.log | head -150 | sed -e 's/[[:cntrl:]]//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests::${summary:-No failing-test summary found; see the Run tests step}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to the deploy commands only.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes careerz@194.5.159.136 deploy-backend
      - name: Check the live API
        run: curl -fsS --retry 5 --retry-delay 3 https://srv2051555.hstgr.cloud/api/health
